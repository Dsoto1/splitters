<text class="ink2" x="64" y="45" font-size="11.5">Every round on the body of an unarmoured standard player (100 health), flight time included; a line stops</text>
<text class="ink2" x="64" y="60" font-size="11.5">where no kill comes within 8 s (or past 2.5 s). Measured in the shared sim: pnpm gun-report.</text>
