# Fly.io: `fly launch --copy-config --no-deploy` once (pick a name), then `fly deploy`.
# Relay (optional, recommended): fly secrets set CLOUDFLARE_TURN_KEY_ID=… CLOUDFLARE_TURN_API_TOKEN=…
app = "chronosplit"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # The hub keeps the game browser and introduces players: keep one machine running.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 800
    hard_limit = 1000

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/lobby/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
