AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Tile Trigger (ToshiroPlay "Trigger") multiplayer control plane: one Lightsail
  instance (site + hub + coturn behind Caddy), its static IP and firewall,
  Route 53 records in the existing toshiroplay.com zone, Lightsail alarms and
  an AWS Budget. Matches run on players' machines, not here
  (docs/MULTIPLAYER_DIRECTION.md). Deploy with infra/deploy-multiplayer.sh,
  which also creates the SSM SecureStrings (TURN secret, hub signing secret)
  that CloudFormation cannot create, and bootstraps the instance.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Instance }
        Parameters: [InstanceName, AvailabilityZone, BlueprintId, BundleId, AdminSshCidr]
      - Label: { default: 'DNS (existing Route 53 hosted zone)' }
        Parameters: [HostedZoneId, ZoneName, HubHostname, ManageHubRecord, ManageRootRecord, ManageTurnRecord, TurnHostname, DnsTtl]
      - Label: { default: Cost safety }
        Parameters: [AlertEmail, BudgetWarnUsd, BudgetLimitUsd, NetworkOutAlarmBytes]
      - Label: { default: 'Secrets and auth (referenced, not created)' }
        Parameters: [SsmPrefix, CognitoRegion, CognitoUserPoolId, CognitoAppClientId, CognitoDomain]
      - Label: { default: Tags }
        Parameters: [ProjectTag, EnvironmentTag]

Parameters:
  InstanceName:
    Type: String
    Default: toshiro-trigger-hub
    AllowedPattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{1,62}$'
    Description: Lightsail instance name (also the static IP's name prefix).
  AvailabilityZone:
    Type: String
    Default: us-east-1a
    Description: Lightsail availability zone (must be in the stack's region).
  BlueprintId:
    Type: String
    Default: ubuntu_24_04
    AllowedValues: [ubuntu_24_04]
    Description: OS image. The bootstrap script targets Ubuntu 24.04.
  BundleId:
    Type: String
    Default: small_3_0
    AllowedValues: [micro_3_0, small_3_0, medium_3_0]
    Description: >-
      Lightsail plan. small_3_0 = 2 GB RAM, 2 vCPU, 60 GB SSD, 3 TB transfer
      (about 12 USD/month). Changing it REPLACES the instance (new disk); the
      static IP moves over and the deploy script rebuilds the box from Git and
      SSM, so nothing is lost but a few minutes of uptime.
  AdminSshCidr:
    Type: String
    Default: ''
    AllowedPattern: '^$|^([0-9]{1,3}\.){3}[0-9]{1,3}/([0-9]|[12][0-9]|3[0-2])$'
    Description: >-
      Optional extra IPv4 CIDR allowed to SSH (e.g. your home IP/32). Leave
      empty: SSH is open only to the Lightsail browser console
      (lightsail-connect). The deploy script opens 22 to its own IP for the
      duration of a run and closes it again.

  HostedZoneId:
    Type: String
    Default: ''
    AllowedPattern: '^$|^Z[A-Z0-9]{4,32}$'
    Description: Route 53 hosted zone ID of the existing toshiroplay.com zone (the deploy script looks it up). Empty = manage no DNS.
  ZoneName:
    Type: String
    Default: toshiroplay.com
    Description: The hosted zone's domain name (no trailing dot).
  HubHostname:
    Type: String
    Default: trigger.toshiroplay.com
    Description: Hostname of the site and hub (HTTPS/WSS via Caddy) and of the TURN URLs handed to players.
  ManageHubRecord:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >-
      Create the A record HubHostname -> static IP in this stack. A record
      made by hand already exists for trigger.toshiroplay.com; CloudFormation
      cannot adopt it, so the deploy script deletes it first only when run
      with --dns replace (see docs/HOSTING.md). 'false' leaves DNS alone.
  ManageRootRecord:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >-
      Also point the zone apex (toshiroplay.com) at the static IP (Caddy then
      redirects it to HubHostname). The apex currently holds a 192.0.2.1
      placeholder; replacing it is the owner's call, so this is off by default.
  ManageTurnRecord:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Also create TurnHostname -> static IP (lets TURN move to its own box later without a client change).
  TurnHostname:
    Type: String
    Default: turn.trigger.toshiroplay.com
    Description: Optional dedicated TURN hostname (used only when ManageTurnRecord is true).
  DnsTtl:
    Type: Number
    Default: 300
    MinValue: 60
    MaxValue: 86400
    Description: TTL (seconds) of the records this stack manages.

  AlertEmail:
    Type: String
    AllowedPattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
    Description: Email for budget alerts (and the Lightsail alarm contact the deploy script sets up).
  BudgetWarnUsd:
    Type: Number
    Default: 15
    MinValue: 1
    Description: Monthly account cost (USD, actual) that sends the first alert.
  BudgetLimitUsd:
    Type: Number
    Default: 25
    MinValue: 1
    Description: Monthly budget (USD). Alerts at 100% actual and 100% forecast.
  NetworkOutAlarmBytes:
    Type: Number
    Default: 300000000
    MinValue: 10000000
    Description: >-
      Lightsail NetworkOut alarm: bytes sent in 5 minutes, three periods in a
      row. 300 MB / 5 min is ~1 MB/s sustained for 15 minutes, the pace that
      would use the 2 GB plan's 3 TB monthly allowance. Normal play (site
      downloads, signaling, a few relayed players) is far below.

  SsmPrefix:
    Type: String
    Default: /toshiro/trigger
    AllowedPattern: '^/[A-Za-z0-9/_.-]+[A-Za-z0-9_.-]$'
    Description: SSM Parameter Store path of the SecureStrings the deploy script creates (turn-secret, hub-signing-secret).
  CognitoRegion:
    Type: String
    Default: us-east-1
    Description: Region of the existing, shared ToshiroPlay Cognito user pool (not managed here).
  CognitoUserPoolId:
    Type: String
    Default: us-east-1_VdMsuDJ59
    AllowedPattern: '^[a-z]{2}-[a-z]+-[0-9]_[A-Za-z0-9]+$'
    Description: Existing Cognito user pool ID (referenced only).
  CognitoAppClientId:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[a-z0-9]{20,32}$'
    Description: App client ID for Trigger in that pool (pending from the owner; empty until then).
  CognitoDomain:
    Type: String
    Default: login.toshiroplay.com
    Description: Hosted UI / managed login domain of the pool.

  ProjectTag:
    Type: String
    Default: toshiro-trigger
    Description: Value of the Project tag on every taggable resource (also usable as a cost allocation tag).
  EnvironmentTag:
    Type: String
    Default: prod
    AllowedValues: [prod, staging, dev]
    Description: Value of the Environment tag.

Conditions:
  HasZone: !Not [!Equals [!Ref HostedZoneId, '']]
  HasAdminSsh: !Not [!Equals [!Ref AdminSshCidr, '']]
  MakeHubRecord: !And [!Condition HasZone, !Equals [!Ref ManageHubRecord, 'true']]
  MakeRootRecord: !And [!Condition HasZone, !Equals [!Ref ManageRootRecord, 'true']]
  MakeTurnRecord: !And [!Condition HasZone, !Equals [!Ref ManageTurnRecord, 'true']]
  HasAppClient: !Not [!Equals [!Ref CognitoAppClientId, '']]

Resources:
  # ------------------------------------------------------------ instance
  # No UserData on purpose: Lightsail runs it once, and changing it in a
  # template replaces the instance. The deploy script bootstraps over SSH
  # instead, idempotently, every run (infra/host-setup.sh).
  HubInstance:
    Type: AWS::Lightsail::Instance
    Properties:
      InstanceName: !Ref InstanceName
      AvailabilityZone: !Ref AvailabilityZone
      BlueprintId: !Ref BlueprintId
      BundleId: !Ref BundleId
      Networking:
        Ports:
          # SSH: Lightsail's browser console only (plus an optional admin CIDR).
          # Never a public game endpoint.
          - FromPort: 22
            ToPort: 22
            Protocol: tcp
            CidrListAliases: [lightsail-connect]
            Cidrs: !If [HasAdminSsh, [!Ref AdminSshCidr], !Ref AWS::NoValue]
          # HTTP: ACME HTTP-01 challenge and the redirect to HTTPS (Caddy).
          - FromPort: 80
            ToPort: 80
            Protocol: tcp
            Cidrs: [0.0.0.0/0]
            Ipv6Cidrs: ['::/0']
          # HTTPS + WSS: site, /lobby (hub HTTP API), /broker (signaling).
          - FromPort: 443
            ToPort: 443
            Protocol: tcp
            Cidrs: [0.0.0.0/0]
            Ipv6Cidrs: ['::/0']
          # STUN/TURN (coturn), UDP and TCP transports.
          - FromPort: 3478
            ToPort: 3478
            Protocol: udp
            Cidrs: [0.0.0.0/0]
            Ipv6Cidrs: ['::/0']
          - FromPort: 3478
            ToPort: 3478
            Protocol: tcp
            Cidrs: [0.0.0.0/0]
            Ipv6Cidrs: ['::/0']
          # TURN relay ports (coturn min-port..max-port). 41 ports = at most
          # ~41 concurrent relay allocations; widen only from measured need.
          - FromPort: 49160
            ToPort: 49200
            Protocol: udp
            Cidrs: [0.0.0.0/0]
            Ipv6Cidrs: ['::/0']
      Tags:
        - { Key: Project, Value: !Ref ProjectTag }
        - { Key: Environment, Value: !Ref EnvironmentTag }
        - { Key: Role, Value: multiplayer-hub }
        - { Key: ManagedBy, Value: cloudformation }

  HubStaticIp:
    Type: AWS::Lightsail::StaticIp
    Properties:
      StaticIpName: !Sub '${InstanceName}-ip'
      AttachedTo: !Ref HubInstance

  # ------------------------------------------------------------ DNS
  HubRecord:
    Type: AWS::Route53::RecordSet
    Condition: MakeHubRecord
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub '${HubHostname}.'
      Type: A
      TTL: !Ref DnsTtl
      ResourceRecords: [!GetAtt HubStaticIp.IpAddress]

  RootRecord:
    Type: AWS::Route53::RecordSet
    Condition: MakeRootRecord
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub '${ZoneName}.'
      Type: A
      TTL: !Ref DnsTtl
      ResourceRecords: [!GetAtt HubStaticIp.IpAddress]

  TurnRecord:
    Type: AWS::Route53::RecordSet
    Condition: MakeTurnRecord
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub '${TurnHostname}.'
      Type: A
      TTL: !Ref DnsTtl
      ResourceRecords: [!GetAtt HubStaticIp.IpAddress]

  # ------------------------------------------------------------ monitoring
  # Lightsail alarms (about 0.10 USD each a month). Email goes to the
  # Lightsail contact method the deploy script creates (it must be verified
  # once from the email Lightsail sends).
  NetworkOutAlarm:
    Type: AWS::Lightsail::Alarm
    Properties:
      AlarmName: !Sub '${InstanceName}-network-out'
      MonitoredResourceName: !Ref HubInstance
      MetricName: NetworkOut
      ComparisonOperator: GreaterThanThreshold
      Threshold: !Ref NetworkOutAlarmBytes
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      TreatMissingData: notBreaching
      ContactProtocols: [Email]
      NotificationEnabled: true
      NotificationTriggers: [ALARM]

  StatusCheckAlarm:
    Type: AWS::Lightsail::Alarm
    Properties:
      AlarmName: !Sub '${InstanceName}-status-check'
      MonitoredResourceName: !Ref HubInstance
      MetricName: StatusCheckFailed
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Threshold: 1
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      TreatMissingData: breaching
      ContactProtocols: [Email]
      NotificationEnabled: true
      NotificationTriggers: [ALARM, OK]

  BurstCapacityAlarm:
    Type: AWS::Lightsail::Alarm
    Properties:
      AlarmName: !Sub '${InstanceName}-cpu-burst'
      MonitoredResourceName: !Ref HubInstance
      MetricName: BurstCapacityPercentage
      ComparisonOperator: LessThanThreshold
      Threshold: 20
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      TreatMissingData: notBreaching
      ContactProtocols: [Email]
      NotificationEnabled: true
      NotificationTriggers: [ALARM]

  # ------------------------------------------------------------ cost
  # Account-wide monthly cost budget (the first two budgets in an account are
  # free). Alerts: actual > BudgetWarnUsd, actual > BudgetLimitUsd, and a
  # forecast over BudgetLimitUsd.
  CostBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub '${ProjectTag}-${EnvironmentTag}-monthly'
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref BudgetLimitUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: !Ref BudgetWarnUsd
            ThresholdType: ABSOLUTE_VALUE
          Subscribers:
            - { SubscriptionType: EMAIL, Address: !Ref AlertEmail }
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: !Ref BudgetLimitUsd
            ThresholdType: ABSOLUTE_VALUE
          Subscribers:
            - { SubscriptionType: EMAIL, Address: !Ref AlertEmail }
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: !Ref BudgetLimitUsd
            ThresholdType: ABSOLUTE_VALUE
          Subscribers:
            - { SubscriptionType: EMAIL, Address: !Ref AlertEmail }

Outputs:
  StaticIp:
    Description: Public static IPv4 of the hub instance.
    Value: !GetAtt HubStaticIp.IpAddress
  InstanceName:
    Description: Lightsail instance name.
    Value: !Ref HubInstance
  InstanceArn:
    Description: Lightsail instance ARN.
    Value: !GetAtt HubInstance.InstanceArn
  HubHostname:
    Description: Site + hub hostname (HTTPS/WSS).
    Value: !Ref HubHostname
  HubUrl:
    Description: Site URL.
    Value: !Sub 'https://${HubHostname}'
  HealthUrl:
    Description: Hub health endpoint.
    Value: !Sub 'https://${HubHostname}/lobby/health'
  SignalingUrl:
    Description: WebRTC signaling (PeerJS broker today; behind the transport abstraction).
    Value: !Sub 'wss://${HubHostname}/broker'
  TurnHostname:
    Description: Hostname in the TURN URLs the hub hands out.
    Value: !If [MakeTurnRecord, !Ref TurnHostname, !Ref HubHostname]
  TurnUris:
    Description: TURN URIs (credentials come only from the hub, short-lived).
    Value: !If
      - MakeTurnRecord
      - !Sub 'turn:${TurnHostname}:3478 turn:${TurnHostname}:3478?transport=tcp'
      - !Sub 'turn:${HubHostname}:3478 turn:${HubHostname}:3478?transport=tcp'
  DnsManaged:
    Description: Which records this stack manages.
    Value: !Sub 'hub=${ManageHubRecord} root=${ManageRootRecord} turn=${ManageTurnRecord} zone=${HostedZoneId}'
  TurnSecretParameter:
    Description: SSM SecureString holding coturn's static-auth-secret (created by the deploy script).
    Value: !Sub '${SsmPrefix}/turn-secret'
  HubSigningSecretParameter:
    Description: SSM SecureString holding the hub's token-signing secret (created by the deploy script).
    Value: !Sub '${SsmPrefix}/hub-signing-secret'
  CognitoIssuer:
    Description: Issuer of ToshiroPlay account tokens the hub will verify (existing pool, not managed here).
    Value: !Sub 'https://cognito-idp.${CognitoRegion}.amazonaws.com/${CognitoUserPoolId}'
  CognitoDomain:
    Description: Managed login domain.
    Value: !Ref CognitoDomain
  CognitoAppClientId:
    Description: App client ID (pending from the owner when empty).
    Value: !If [HasAppClient, !Ref CognitoAppClientId, 'pending']
  BudgetName:
    Description: Monthly cost budget.
    Value: !Sub '${ProjectTag}-${EnvironmentTag}-monthly'
