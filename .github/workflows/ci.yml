name: CI

# check/* branches are merge candidates: CI runs what the change needs there (tools/ci/select.mjs maps the
# changed files to e2e flows and unit tests; e2e/flowMap.mjs is the map), and only a green candidate is
# fast-forwarded to main. A push to main whose commit already went green on a check branch runs nothing again.
# Everything runs nightly on main, for v* tags, and from "Run workflow" (workflow_dispatch, full on by default).
# Pushes also package the deployable site (site job) and, once everything is green, publish it to GitHub
# Releases (release job): main → main-latest, v* → vX.Y.Z, check/** → check-builds. The Lightsail box
# downloads and verifies that build instead of building (infra/tiletrigger-update.sh, docs/HOSTING.md).
on:
  push:
    branches: [main, 'check/**']
    tags: ['v*']
  pull_request:
  schedule:
    # Nightly, full suite on main (03:17 UTC).
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: Run everything (no skip for an already-green commit, no change-based selection)
        type: boolean
        default: true

# The plan job reads earlier runs of this workflow (the green-on-a-check-branch lookup). Only the release
# job may write (releases, attestations): its own permissions below.
permissions:
  contents: read
  actions: read

# A newer commit makes the run for the older one pointless (the nightly run has its own group).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'schedule' && 'nightly' || 'push' }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.plan.outputs.skip }}
      green_run: ${{ steps.prior.outputs.run_id }}
      full: ${{ steps.plan.outputs.full }}
      e2e: ${{ steps.plan.outputs.e2e }}
      shards: ${{ steps.plan.outputs.shards }}
      unit: ${{ steps.plan.outputs.unit }}
      perf: ${{ steps.plan.outputs.perf }}
      docs_only: ${{ steps.plan.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge base with main, for the changed files.
          fetch-depth: 0
      # main is fast-forwarded only to commits that went green on a check branch: don't test them twice.
      - name: Already green on a check branch?
        id: prior
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              head_sha: context.sha,
              status: 'success',
              per_page: 100,
            });
            const green = runs.find((r) => r.path === '.github/workflows/ci.yml' && r.event === 'push' && (r.head_branch ?? '').startsWith('check/') && r.id !== context.runId);
            core.setOutput('green', green ? 'true' : 'false');
            // Its packaged site (client-release), so main publishes that very build instead of building again.
            core.setOutput('run_id', green ? String(green.id) : '');
            if (green) core.notice(`Commit ${context.sha.slice(0, 7)} already passed CI on ${green.head_branch}: ${green.html_url}`);
      - name: Plan
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_REF: ${{ github.base_ref }}
          DISPATCH_FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
          GREEN: ${{ steps.prior.outputs.green }}
        run: |
          if [ "$GREEN" = "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "### CI plan"$'\n\n'"- Already green on a check branch: nothing to run again." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          base=origin/main
          [ "$EVENT" = "pull_request" ] && base="origin/$BASE_REF"
          full=""
          case "$EVENT" in
            schedule) full=--full ;;
            workflow_dispatch) [ "$DISPATCH_FULL" = "true" ] && full=--full ;;
            push) case "$REF" in refs/tags/*|refs/heads/main) full=--full ;; esac ;;
          esac
          node tools/ci/select.mjs --github --base "$base" $full

  # The built site for the browser tests and the perf check (they don't build it again).
  build:
    needs: plan
    if: needs.plan.outputs.skip != 'true' && (needs.plan.outputs.e2e == 'true' || needs.plan.outputs.perf == 'true')
    # Pinned: Playwright 1.56 has no browser builds for newer Ubuntu images.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Safari: no chunk may import from the match worker's entry file (tools/ci/check-worker-entry.mjs).
      - run: node tools/ci/check-worker-entry.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: packages/client/dist
          retention-days: 1

  # The deployable site: built with VITE_HUB=self (the site is served by its hub; the only difference from
  # the e2e build), packaged reproducibly (tools/ci/client-release.sh) and smoke-tested through the hub the
  # way the box runs it. Kept 14 days, so a fast-forward of main publishes this run's package.
  site:
    needs: plan
    if: github.event_name == 'push' && needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          VITE_HUB: self
      - run: tools/ci/client-release.sh package packages/client/dist client-release
        env:
          VITE_HUB: self
      - name: Smoke test (the hub serves the unpacked package)
        run: |
          site="$RUNNER_TEMP/site" && mkdir -p "$site"
          tar -xzf "client-release/tiletrigger-client-$GITHUB_SHA.tar.gz" -C "$site"
          (cd packages/server && PORT=8099 HOST=127.0.0.1 SITE_DIR="$site" node --import tsx src/hub.ts > "$RUNNER_TEMP/hub.log" 2>&1 &)
          for _ in $(seq 1 60); do curl -fsS http://127.0.0.1:8099/lobby/health >/dev/null 2>&1 && break; sleep 0.5; done
          curl -fsS http://127.0.0.1:8099/ -o "$RUNNER_TEMP/index.html"
          cmp "$RUNNER_TEMP/index.html" "$site/index.html"
          asset="$(grep -o 'src="/assets/[^"]*\.js"' "$site/index.html" | head -1 | sed 's/^src="//; s/"$//')"
          curl -fsS -o /dev/null "http://127.0.0.1:8099$asset"
          echo "hub served the page and $asset"
      - uses: actions/upload-artifact@v4
        with:
          name: client-release
          path: client-release
          retention-days: 14

  check:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    # A hung step fails the run instead of holding it for GitHub's 6 h default.
    timeout-minutes: 30
    env:
      UNIT: ${{ needs.plan.outputs.unit }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No new fixed sleeps in the browser tests (tools/ci/lint-e2e-waits.mjs).
      - run: node tools/ci/lint-e2e-waits.mjs
      # The deploy and release scripts (shellcheck comes with the runner image).
      - run: shellcheck -S warning infra/*.sh infra/test/*.sh deploy/*.sh tools/ci/*.sh
      - if: needs.plan.outputs.docs_only != 'true'
        run: pnpm typecheck
      - if: needs.plan.outputs.docs_only != 'true'
        run: pnpm content:check
      # Unit tests: all of them, or the packages the change touches ('none': no tests to run).
      - if: env.UNIT == 'all'
        run: pnpm test
      - if: env.UNIT != 'all' && env.UNIT != 'none' && env.UNIT != ''
        run: |
          # shellcheck disable=SC2086 # one argument per test folder
          pnpm exec vitest run $UNIT
      - if: env.UNIT == 'all'
        run: |
          pnpm validate-map maps/phase0_arena.json
          pnpm validate-map maps/m3_vault.json
          pnpm validate-map maps/m4_outpost.json
      - if: env.UNIT == 'all'
        run: pnpm bench 32 15 -- --npcs=32
      - if: env.UNIT == 'all'
        run: pnpm bench 32 30

  e2e:
    needs: [plan, build]
    if: needs.plan.outputs.skip != 'true' && needs.plan.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      # Flows balanced over up to 8 shards by measured time (e2e/timings.json, e2e/shards.mjs).
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    name: e2e (${{ matrix.shard.index }}/${{ matrix.shard.of }})
    # A shard is planned at about 10 minutes; a failed flow runs twice.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: packages/client/dist
      - id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      # The browser, kept between runs (keyed by the Playwright version that wants it).
      - id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      # The browser install (apt + download) normally takes ~20 s but has hung for hours on a runner: cap each try and retry.
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: for i in 1 2 3; do timeout 300 pnpm exec playwright install --with-deps chromium && exit 0; echo "playwright install try $i failed"; sleep 10; done; exit 1
        timeout-minutes: 17
      # Cached browser: the runner image has its libraries; install them only if it doesn't start.
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: |
          node -e "require('playwright').chromium.launch().then((b) => b.close())" && exit 0
          for i in 1 2 3; do timeout 300 pnpm exec playwright install-deps chromium && exit 0; echo "playwright install-deps try $i failed"; sleep 10; done; exit 1
        timeout-minutes: 17
      - run: pnpm e2e
        env:
          E2E_ONLY: ${{ matrix.shard.flows }}
          E2E_SHARD_LABEL: ${{ matrix.shard.index }}/${{ matrix.shard.of }}
          # A failed flow runs once more; passing then, it's reported as FLAKY (job summary, flaky log) and doesn't fail the run.
          E2E_RETRIES: '1'
          E2E_TIMINGS_OUT: e2e-artifacts/timings-${{ matrix.shard.index }}.json
          E2E_STACKS: '1' # page errors come with their stacks, to trace CI-only failures
      # Per-flow times, for refreshing e2e/timings.json (tools/ci/timings.mjs).
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-timings-${{ matrix.shard.index }}
          path: e2e-artifacts/timings-*.json
          retention-days: 14
          if-no-files-found: ignore
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-flaky-${{ matrix.shard.index }}
          path: e2e-artifacts/flaky.log
          retention-days: 14
          if-no-files-found: ignore
      # What the pages showed when a check failed (and the visual flow's new pictures and diffs).
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots-${{ matrix.shard.index }}
          path: e2e-artifacts
          retention-days: 7
          if-no-files-found: ignore

  # Draw-call budget (docs/PERF_96.md): 96 players clumped on Frost Basin at Medium and Low. It counts draw
  # calls, not frame times, so CPU rendering on the runner doesn't matter.
  perf:
    needs: [plan, build]
    if: needs.plan.outputs.skip != 'true' && needs.plan.outputs.perf == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: packages/client/dist
      - id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: for i in 1 2 3; do timeout 300 pnpm exec playwright install --with-deps chromium && exit 0; echo "playwright install try $i failed"; sleep 10; done; exit 1
        timeout-minutes: 17
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: |
          node -e "require('playwright').chromium.launch().then((b) => b.close())" && exit 0
          for i in 1 2 3; do timeout 300 pnpm exec playwright install-deps chromium && exit 0; echo "playwright install-deps try $i failed"; sleep 10; done; exit 1
        timeout-minutes: 17
      - run: pnpm perf:budget

  # Publishes the site package once everything this run needed is green (or the commit already went green on
  # a check branch: then that run's package, the very bytes it tested). Signs it with a Sigstore build-provenance
  # attestation (keyless: GitHub's OIDC identity of this workflow; no key to manage), which the box verifies.
  release:
    needs: [plan, site, check, build, e2e, perf]
    if: >-
      always() && github.event_name == 'push' && needs.plan.result == 'success' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/check/')) &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # One publisher at a time per release (main-latest, tags, check-builds); never cancelled half-way.
    concurrency:
      group: client-release-${{ startsWith(github.ref, 'refs/tags/') && 'tags' || github.ref == 'refs/heads/main' && 'main' || 'check' }}
      cancel-in-progress: false
    permissions:
      contents: write # the release and its assets
      id-token: write # Sigstore signing identity
      attestations: write # the build-provenance attestation
      actions: read # the check run's package
    steps:
      - uses: actions/checkout@v4
      - if: needs.site.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: client-release
          path: client-release
      # Fast-forwarded main: the check run's package of this commit.
      - id: reuse
        if: needs.site.result != 'success' && needs.plan.outputs.green_run != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: client-release
          path: client-release
          run-id: ${{ needs.plan.outputs.green_run }}
          github-token: ${{ github.token }}
      - id: have
        run: |
          if [ -s "client-release/tiletrigger-client-$GITHUB_SHA.tar.gz" ]; then echo "package=true" >> "$GITHUB_OUTPUT"
          else echo "package=false" >> "$GITHUB_OUTPUT"; echo "::notice::No package of $GITHUB_SHA from this run or its check run (expired?): building it again"; fi
      - if: steps.have.outputs.package != 'true'
        uses: pnpm/action-setup@v4
      - if: steps.have.outputs.package != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.have.outputs.package != 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          rm -rf client-release
          tools/ci/client-release.sh package packages/client/dist client-release
        env:
          VITE_HUB: self
      - name: Check the package
        run: |
          cd client-release
          sha256sum --strict -c "tiletrigger-client-$GITHUB_SHA.sha256"
          # Built for this commit, for a site served by its hub.
          node -e 'const b = require(process.argv[1]); if (b.sha !== process.env.GITHUB_SHA || b.hub !== "self") { console.error("package is for", b.sha, "hub", b.hub); process.exit(1); }' "$PWD/tiletrigger-client-$GITHUB_SHA.json"
      - id: attest
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            client-release/tiletrigger-client-${{ github.sha }}.tar.gz
            client-release/tiletrigger-client-${{ github.sha }}.json
      - name: Publish
        run: |
          cp "$BUNDLE" "client-release/tiletrigger-client-$GITHUB_SHA.sigstore.json"
          tools/ci/client-release.sh publish client-release
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
