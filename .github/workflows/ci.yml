name: CI

on:
  push:
  pull_request:

jobs:
  check:
    # Pinned: Playwright 1.56 has no browser builds for newer Ubuntu images.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm content:check
      - run: pnpm test
      - run: pnpm validate-map maps/phase0_arena.json
      - run: pnpm validate-map maps/m3_vault.json
      - run: pnpm validate-map maps/m4_outpost.json
      - run: pnpm bench 32 15 -- --npcs=32
      - run: pnpm bench 32 30
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
