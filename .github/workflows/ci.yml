name: CI

# check/* branches are merge candidates: CI runs what the change needs there (tools/ci/select.mjs maps the
# changed files to e2e flows and unit tests; e2e/flowMap.mjs is the map), and only a green candidate is
# fast-forwarded to main. A push to main whose commit already went green on a check branch runs nothing again.
# Everything runs nightly on main, for v* tags, and from "Run workflow" (workflow_dispatch, full on by default).
# Pushes also package the deployable site (site job) and, once everything is green, publish it to GitHub
# Releases (release job): main → main-latest (and vX.Y.Z when main reaches a new version), v* → vX.Y.Z, check/** → check-builds. The Lightsail box
# downloads and verifies that build instead of building (infra/tiletrigger-update.sh, docs/HOSTING.md).
on:
  push:
    branches: [main, 'check/**']
    tags: ['v*']
  pull_request:
  schedule:
    # Nightly, full suite on main (03:17 UTC).
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: Run everything (no skip for an already-green commit, no change-based selection)
        type: boolean
        default: true

# The plan job reads earlier runs of this workflow (the green-on-a-check-branch lookup). Only the release
# job may write (releases, attestations): its own permissions below.
permissions:
  contents: read
  actions: read

# One run per branch: a new push to a check/ branch cancels the older run there (it is pointless now). Nothing else is
# cancelled: every main commit must finish and publish main-latest (a fast-forward followed seconds later by a
# notes-only commit cancelled the release of 9a959ee, and the box stayed on an older build), and nightly runs and
# tags have their own groups.
# Fail fast: the long steps (unit tests, e2e shards, perf) run under tools/ci/stop-on-failure.sh, which stops them as
# soon as any other job of the run has failed; they fail too, so the run reads "failure" (not "cancelled") and
# land/train refuse it as before.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'schedule' && 'nightly' || 'push' }}
  cancel-in-progress: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/check/') }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.plan.outputs.skip }}
      green_run: ${{ steps.prior.outputs.run_id }}
      full: ${{ steps.plan.outputs.full }}
      e2e: ${{ steps.plan.outputs.e2e }}
      shards: ${{ steps.plan.outputs.shards }}
      unit: ${{ steps.plan.outputs.unit }}
      unit_jobs: ${{ steps.plan.outputs.unit_jobs }}
      timings_run: ${{ steps.timings.outputs.run_id }}
      perf: ${{ steps.plan.outputs.perf }}
      docs_only: ${{ steps.plan.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge base with main, for the changed files.
          fetch-depth: 0
      # main is fast-forwarded only to commits that went green on a check branch: don't test them twice. Nor a
      # commit (on main or a check branch) whose code, docs left out, equals one that went green there: a docs-only
      # commit merged into a green batch re-ran the whole suite (tools/ci/greenTree.mjs decides; any other file differing runs).
      - name: Already green on a check branch?
        id: prior
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/check/'))
        uses: actions/github-script@v7
        with:
          script: |
            const isGreenCheck = (r) => r.path === '.github/workflows/ci.yml' && r.event === 'push' && (r.head_branch ?? '').startsWith('check/') && r.id !== context.runId;
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              head_sha: context.sha,
              status: 'success',
              per_page: 100,
            });
            const green = runs.find(isGreenCheck);
            if (green) {
              core.setOutput('green', 'true');
              // Its packaged site (client-release), so main publishes that very build instead of building again.
              core.setOutput('run_id', String(green.id));
              core.notice(`Commit ${context.sha.slice(0, 7)} already passed CI on ${green.head_branch}: ${green.html_url}`);
              return;
            }
            // The same code as a recent green check commit (docs may differ). Its package names the other commit, so
            // the release job builds this one's (no run_id).
            const { findGreenTwin } = await import(`${process.env.GITHUB_WORKSPACE}/tools/ci/greenTree.mjs`);
            const { data } = await github.rest.actions.listWorkflowRuns({ owner: context.repo.owner, repo: context.repo.repo, workflow_id: 'ci.yml', event: 'push', status: 'success', per_page: 100 });
            const recent = data.workflow_runs.filter(isGreenCheck);
            const twin = findGreenTwin(context.sha, recent.map((r) => r.head_sha), { cwd: process.env.GITHUB_WORKSPACE, fetch: true });
            if (twin) {
              const run = recent.find((r) => r.head_sha === twin.sha);
              core.setOutput('green', 'true');
              core.setOutput('run_id', '');
              core.notice(`Same code as ${twin.sha.slice(0, 7)}, green on ${run.head_branch} (${run.html_url}); only docs differ: ${twin.docs.join(', ') || 'none'}`);
              return;
            }
            core.setOutput('green', 'false');
            // Not itself green on a check branch (a notes-only commit pushed straight to main, or a check branch built
            // on a candidate that already went green): test what changed since the nearest earlier first-parent commit
            // that was, rather than everything (a flaky flow then held back the release; a small change on top of a
            // green candidate re-ran its whole suite).
            if (context.ref === 'refs/heads/main' || context.ref.startsWith('refs/heads/check/')) {
              const { execSync } = require('child_process');
              const shas = execSync('git rev-list --first-parent -n 30 HEAD~1', { encoding: 'utf8' }).split('\n').filter(Boolean);
              for (const sha of shas) {
                const prior = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, { owner: context.repo.owner, repo: context.repo.repo, head_sha: sha, status: 'success', per_page: 100 });
                if (prior.some(isGreenCheck)) {
                  core.setOutput('green_base', sha);
                  core.notice(`Testing what changed since ${sha.slice(0, 7)}, the nearest commit that passed on a check branch`);
                  break;
                }
              }
            }
      # The flows' measured durations the shards are packed by: the newest table CI merged from its own timings
      # (the timings job's e2e-timings artifact, kept 30 days), else the committed e2e/timings.json.
      - name: Newest e2e timings
        id: timings
        if: steps.prior.outputs.green != 'true'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({ owner: context.repo.owner, repo: context.repo.repo, workflow_id: 'ci.yml', status: 'completed', per_page: 30 });
            for (const run of data.workflow_runs) {
              if (run.id === context.runId) continue;
              const { data: a } = await github.rest.actions.listWorkflowRunArtifacts({ owner: context.repo.owner, repo: context.repo.repo, run_id: run.id, name: 'e2e-timings' });
              if (a.artifacts.some((x) => !x.expired)) {
                core.setOutput('run_id', String(run.id));
                core.notice(`e2e timings from run ${run.id} (${run.head_branch})`);
                return;
              }
            }
            core.notice('No e2e-timings artifact in the last 30 runs: the committed e2e/timings.json');
      - if: steps.timings.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: e2e-timings
          path: e2e
          run-id: ${{ steps.timings.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Plan
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_REF: ${{ github.base_ref }}
          DISPATCH_FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
          GREEN: ${{ steps.prior.outputs.green }}
          GREEN_BASE: ${{ steps.prior.outputs.green_base }}
        run: |
          if [ "$GREEN" = "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "### CI plan"$'\n\n'"- Already green on a check branch (this commit, or the same code with only docs differing): nothing to run again." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          base=origin/main
          [ "$EVENT" = "pull_request" ] && base="origin/$BASE_REF"
          full=""
          # The browser map tour (every map in a browser) only nightly, for v* tags and from Run workflow.
          case "$EVENT" in
            schedule) full="--full --tour" ;;
            workflow_dispatch) [ "$DISPATCH_FULL" = "true" ] && full="--full --tour" ;;
            push) case "$REF" in
                refs/tags/*) full="--full --tour" ;;
                refs/heads/main) if [ -n "$GREEN_BASE" ]; then base="$GREEN_BASE"; else full=--full; fi ;;
                refs/heads/check/*) [ -n "$GREEN_BASE" ] && base="$GREEN_BASE" ;;
              esac ;;
          esac
          # shellcheck disable=SC2086 # the flags are separate words
          node tools/ci/select.mjs --github --base "$base" $full

  # The built site for the browser tests and the perf check (they don't build it again).
  build:
    needs: plan
    if: needs.plan.outputs.skip != 'true' && (needs.plan.outputs.e2e == 'true' || needs.plan.outputs.perf == 'true')
    # Pinned: Playwright 1.56 has no browser builds for newer Ubuntu images.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Safari: no chunk may import from the match worker's entry file (tools/ci/check-worker-entry.mjs).
      - run: node tools/ci/check-worker-entry.mjs
      - name: Bundle budget (the JS a first visit loads before the menu; docs/LOADING.md)
        run: node tools/ci/bundle-budget.mjs packages/client/dist
      - uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: packages/client/dist
          retention-days: 1

  # The deployable site: built with VITE_HUB=self (the site is served by its hub; the only difference from
  # the e2e build), packaged reproducibly (tools/ci/client-release.sh) and smoke-tested through the hub the
  # way the box runs it. Kept 14 days, so a fast-forward of main publishes this run's package.
  site:
    needs: plan
    if: github.event_name == 'push' && needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          VITE_HUB: self
      - name: Bundle budget (the JS a first visit loads before the menu; docs/LOADING.md)
        run: node tools/ci/bundle-budget.mjs packages/client/dist
      - run: tools/ci/client-release.sh package packages/client/dist client-release
        env:
          VITE_HUB: self
      - name: Smoke test (the hub serves the unpacked package)
        run: |
          site="$RUNNER_TEMP/site" && mkdir -p "$site"
          tar -xzf "client-release/tiletrigger-client-$GITHUB_SHA.tar.gz" -C "$site"
          (cd packages/server && PORT=8099 HOST=127.0.0.1 SITE_DIR="$site" node --import tsx src/hub.ts > "$RUNNER_TEMP/hub.log" 2>&1 &)
          for _ in $(seq 1 60); do curl -fsS http://127.0.0.1:8099/lobby/health >/dev/null 2>&1 && break; sleep 0.5; done
          curl -fsS http://127.0.0.1:8099/ -o "$RUNNER_TEMP/index.html"
          cmp "$RUNNER_TEMP/index.html" "$site/index.html"
          asset="$(grep -o 'src="/assets/[^"]*\.js"' "$site/index.html" | head -1 | sed 's/^src="//; s/"$//')"
          curl -fsS -o /dev/null "http://127.0.0.1:8099$asset"
          echo "hub served the page and $asset"
      - uses: actions/upload-artifact@v4
        with:
          name: client-release
          path: client-release
          retention-days: 14

  # Lints, types, content and the map validator, bot benches; the unit tests run beside it (unit job).
  check:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    # A hung step fails the run instead of holding it for GitHub's 6 h default.
    timeout-minutes: 30
    env:
      UNIT: ${{ needs.plan.outputs.unit }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No new fixed sleeps in the browser tests (tools/ci/lint-e2e-waits.mjs).
      - run: node tools/ci/lint-e2e-waits.mjs
      # The deploy and release scripts (shellcheck comes with the runner image).
      - run: shellcheck -S warning infra/*.sh infra/test/*.sh deploy/*.sh tools/ci/*.sh
      - if: needs.plan.outputs.docs_only != 'true'
        run: pnpm typecheck
      - if: needs.plan.outputs.docs_only != 'true'
        run: pnpm content:check
      - if: env.UNIT == 'all'
        run: |
          pnpm validate-map maps/phase0_arena.json
          pnpm validate-map maps/m3_vault.json
          pnpm validate-map maps/m4_outpost.json
          pnpm validate-map maps/test_coverage.json
      - if: env.UNIT == 'all'
        run: pnpm bench 32 15 -- --npcs=32
      - if: env.UNIT == 'all'
        run: pnpm bench 32 30

  # Unit tests, side by side (the plan's unit_jobs: vitest shards of the packages the change touches, and the
  # headless check of every map, packages/shared/test/allMaps*.test.ts, in jobs of its own).
  unit:
    needs: plan
    if: needs.plan.outputs.skip != 'true' && needs.plan.outputs.unit_jobs != '[]' && needs.plan.outputs.unit_jobs != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.unit_jobs) }}
    name: unit (${{ matrix.job.name }})
    steps:
      # The whole tree: content tests read the client's models.
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - env:
          ARGS: ${{ matrix.job.args }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # shellcheck disable=SC2086 # vitest's arguments, one word each
          tools/ci/stop-on-failure.sh pnpm exec vitest run $ARGS

  e2e:
    needs: [plan, build]
    if: needs.plan.outputs.skip != 'true' && needs.plan.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      # Flows packed into up to 16 shards by measured time (e2e/timings.json, refreshed by the timings job; e2e/shards.mjs).
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    name: e2e (${{ matrix.shard.index }}/${{ matrix.shard.of }})
    # A shard is planned at about 5 minutes; a failed flow runs twice.
    timeout-minutes: 45
    steps:
      # The site comes built (client-dist): no need for the client's models or the raw asset sources.
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/packages/client/public/
            !/assets-src/
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: packages/client/dist
      - id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      # The browser, kept between runs (keyed by the Playwright version that wants it).
      - id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      # The browser install (apt + download) normally takes ~20 s but has hung for hours on a runner: cap each try and retry.
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: for i in 1 2 3; do timeout 300 pnpm exec playwright install --with-deps chromium && exit 0; echo "playwright install try $i failed"; sleep 10; done; exit 1
        timeout-minutes: 17
      # Cached browser: the runner image has its libraries; install them only if it doesn't start.
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: |
          node -e "require('playwright').chromium.launch().then((b) => b.close())" && exit 0
          for i in 1 2 3; do timeout 300 pnpm exec playwright install-deps chromium && exit 0; echo "playwright install-deps try $i failed"; sleep 10; done; exit 1
        timeout-minutes: 17
      - run: tools/ci/stop-on-failure.sh pnpm e2e
        env:
          GH_TOKEN: ${{ github.token }}
          E2E_ONLY: ${{ matrix.shard.flows }}
          # A change to a few maps: the 'maps' flow tours just those (empty: its whole part).
          E2E_MAPS: ${{ matrix.shard.maps }}
          E2E_SHARD_LABEL: ${{ matrix.shard.index }}/${{ matrix.shard.of }}
          # A failed flow runs once more; passing then, it's reported as FLAKY (job summary, flaky log) and doesn't fail the run.
          E2E_RETRIES: '1'
          E2E_TIMINGS_OUT: e2e-artifacts/timings-${{ matrix.shard.index }}.json
          E2E_STACKS: '1' # page errors come with their stacks, to trace CI-only failures
      # Per-flow times, for refreshing e2e/timings.json (tools/ci/timings.mjs).
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-timings-${{ matrix.shard.index }}
          path: e2e-artifacts/timings-*.json
          retention-days: 14
          if-no-files-found: ignore
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-flaky-${{ matrix.shard.index }}
          path: e2e-artifacts/flaky.log
          retention-days: 14
          if-no-files-found: ignore
      # What the pages showed when a check failed (and the visual flow's new pictures and diffs).
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots-${{ matrix.shard.index }}
          path: e2e-artifacts
          retention-days: 7
          if-no-files-found: ignore

  # The flows' durations for the next plan: this run's measurements merged into the table its plan used, kept as the
  # e2e-timings artifact (the plan job takes the newest). Commit a refreshed table from it now and then.
  timings:
    needs: [plan, e2e]
    if: always() && needs.plan.outputs.e2e == 'true' && needs.e2e.result != 'skipped' && needs.e2e.result != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            e2e
            tools/ci
      - if: needs.plan.outputs.timings_run != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: e2e-timings
          path: e2e
          run-id: ${{ needs.plan.outputs.timings_run }}
          github-token: ${{ github.token }}
      - continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: e2e-timings-*
          path: measured
      - run: |
          mkdir -p out measured
          node tools/ci/timings.mjs merge --base e2e/timings.json --out out/timings.json measured | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-timings
          path: out/timings.json
          retention-days: 30

  # Draw-call budget (docs/PERF_96.md): 96 players clumped on Frost Basin at Medium and Low. It counts draw
  # calls, not frame times, so CPU rendering on the runner doesn't matter.
  # The two checks run side by side (each ~3-5 min on its own runner).
  perf:
    needs: [plan, build]
    if: needs.plan.outputs.skip != 'true' && needs.plan.outputs.perf == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        check: [budget, mass]
    name: perf (${{ matrix.check }})
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/packages/client/public/
            !/assets-src/
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: packages/client/dist
      - id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: for i in 1 2 3; do timeout 300 pnpm exec playwright install --with-deps chromium && exit 0; echo "playwright install try $i failed"; sleep 10; done; exit 1
        timeout-minutes: 17
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: |
          node -e "require('playwright').chromium.launch().then((b) => b.close())" && exit 0
          for i in 1 2 3; do timeout 300 pnpm exec playwright install-deps chromium && exit 0; echo "playwright install-deps try $i failed"; sleep 10; done; exit 1
        timeout-minutes: 17
      - if: matrix.check == 'budget'
        run: tools/ci/stop-on-failure.sh pnpm perf:budget
        env:
          GH_TOKEN: ${{ github.token }}
      # Mass casualty (docs/PHYSICS_FX.md): one blast kills 20 in a 24 v 24; the worst frame's game JS after it and
      # the ragdoll bodies awake at once stay within budget (CPU rendering doesn't inflate the JS part).
      - if: matrix.check == 'mass'
        run: tools/ci/stop-on-failure.sh pnpm perf:mass
        env:
          GH_TOKEN: ${{ github.token }}

  # Publishes the site package once everything this run needed is green (or the commit already went green on
  # a check branch: then that run's package, the very bytes it tested). Signs it with a Sigstore build-provenance
  # attestation (keyless: GitHub's OIDC identity of this workflow; no key to manage), which the box verifies.
  release:
    needs: [plan, site, check, unit, build, e2e, perf]
    if: >-
      always() && github.event_name == 'push' && needs.plan.result == 'success' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/check/')) &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # One publisher at a time per release (main-latest, tags, check-builds); never cancelled half-way.
    concurrency:
      group: client-release-${{ startsWith(github.ref, 'refs/tags/') && 'tags' || github.ref == 'refs/heads/main' && 'main' || 'check' }}
      cancel-in-progress: false
    permissions:
      contents: write # the release and its assets
      id-token: write # Sigstore signing identity
      attestations: write # the build-provenance attestation
      actions: read # the check run's package
    steps:
      - uses: actions/checkout@v4
      - if: needs.site.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: client-release
          path: client-release
      # Fast-forwarded main: the check run's package of this commit.
      - id: reuse
        if: needs.site.result != 'success' && needs.plan.outputs.green_run != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: client-release
          path: client-release
          run-id: ${{ needs.plan.outputs.green_run }}
          github-token: ${{ github.token }}
      - id: have
        run: |
          if [ -s "client-release/tiletrigger-client-$GITHUB_SHA.tar.gz" ]; then echo "package=true" >> "$GITHUB_OUTPUT"
          else echo "package=false" >> "$GITHUB_OUTPUT"; echo "::notice::No package of $GITHUB_SHA from this run or its check run (expired?): building it again"; fi
      - if: steps.have.outputs.package != 'true'
        uses: pnpm/action-setup@v4
      - if: steps.have.outputs.package != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.have.outputs.package != 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          rm -rf client-release
          tools/ci/client-release.sh package packages/client/dist client-release
        env:
          VITE_HUB: self
      - name: Check the package
        run: |
          cd client-release
          sha256sum --strict -c "tiletrigger-client-$GITHUB_SHA.sha256"
          # Built for this commit, for a site served by its hub.
          node -e 'const b = require(process.argv[1]); if (b.sha !== process.env.GITHUB_SHA || b.hub !== "self") { console.error("package is for", b.sha, "hub", b.hub); process.exit(1); }' "$PWD/tiletrigger-client-$GITHUB_SHA.json"
      - id: attest
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            client-release/tiletrigger-client-${{ github.sha }}.tar.gz
            client-release/tiletrigger-client-${{ github.sha }}.json
      - name: Publish
        run: |
          cp "$BUNDLE" "client-release/tiletrigger-client-$GITHUB_SHA.sigstore.json"
          tools/ci/client-release.sh publish client-release
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}

  # The Host Service downloads (packages/host/tools/package.mjs): one archive per OS with the Node runtime,
  # the bundled service, node-datachannel's prebuilt module and our maps. Built on Linux for every OS (only the
  # runtime and the native module differ, both downloaded and checked), smoke-tested on Linux, attested like the
  # site, and published beside it under fixed names (the /host page links main-latest's).
  host-release:
    needs: [plan, release]
    if: >-
      always() && needs.release.result == 'success' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: host-release-${{ startsWith(github.ref, 'refs/tags/') && 'tags' || 'main' }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm host:package --out "$PWD/host-release"
      - name: Smoke test (the Linux package starts, registers on a local hub and lists itself)
        run: |
          (cd packages/server && PORT=8098 HOST=127.0.0.1 SITE_DIR=/nonexistent node --import tsx src/hub.ts > "$RUNNER_TEMP/hub.log" 2>&1 &)
          for _ in $(seq 1 60); do curl -fsS http://127.0.0.1:8098/lobby/health >/dev/null 2>&1 && break; sleep 0.5; done
          mkdir -p "$RUNNER_TEMP/host" && tar -xzf host-release/tiletrigger-host-linux-x64.tar.gz -C "$RUNNER_TEMP/host"
          (cd "$RUNNER_TEMP/host/tiletrigger-host" && HUB=http://127.0.0.1:8098 HOST_STATE_DIR="$RUNNER_TEMP/state" SERVER_NAME="CI smoke" MAP=sandgate BOT_FILL=8 ./start-host.sh --no-console > "$RUNNER_TEMP/host.log" 2>&1 &)
          for _ in $(seq 1 90); do curl -fsS http://127.0.0.1:8098/lobby/games | grep -q '"CI smoke"' && break; sleep 1; done
          cat "$RUNNER_TEMP/host.log"
          curl -fsS http://127.0.0.1:8098/lobby/games | grep '"hostType":"dedicated"'
      - id: attest
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: host-release/tiletrigger-host-*
      - name: Publish
        run: |
          tags=(main-latest)
          case "$GITHUB_REF" in refs/tags/*) tags=("${GITHUB_REF#refs/tags/}") ;; esac
          # main reaching a new version made its release in the release job (client-release.sh): the downloads go there too.
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            v="v$(node -p "require('./packages/client/package.json').version")"
            if gh release view "$v" >/dev/null 2>&1 && ! gh release view "$v" --json assets -q '.assets[].name' | grep -qx tiletrigger-host-SHA256SUMS; then tags+=("$v"); fi
          fi
          cd host-release
          sha256sum tiletrigger-host-*.zip tiletrigger-host-*.tar.gz > tiletrigger-host-SHA256SUMS
          cp "$BUNDLE" tiletrigger-host.sigstore.json
          for tag in "${tags[@]}"; do gh release upload "$tag" tiletrigger-host-*.zip tiletrigger-host-*.tar.gz tiletrigger-host-SHA256SUMS tiletrigger-host.sigstore.json --clobber; done
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
