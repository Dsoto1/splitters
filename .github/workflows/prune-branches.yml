name: Prune branches

# Deletes the work branches that have landed (owner, 2026-11-06: "run after each landing"): every wip/ and check/
# branch whose commits are all in main. It runs after each push to main (a landing), and from the Actions tab
# (Run workflow; tick "Only list them" to see what it would delete). It never touches main, claude/ session
# branches, release/ branches or tags, and never a branch with a commit main doesn't have, so no work is lost.
# Agents can't delete branches themselves (their GitHub access only creates and moves them); this does it for them.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only list them (delete nothing)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: prune-branches
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Delete landed work branches
        env:
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: |
          set -euo pipefail
          git fetch --prune --quiet origin '+refs/heads/*:refs/remotes/origin/*'
          # Work branches whose every commit is in main: their work has landed.
          mapfile -t landed < <(git for-each-ref --merged origin/main --format='%(refname:lstrip=3)' refs/remotes/origin/wip refs/remotes/origin/check)
          {
            echo "### Landed work branches: ${#landed[@]}"
            if [ "$DRY_RUN" = true ]; then echo "Only listing them (nothing deleted)."; fi
            printf -- '- %s\n' "${landed[@]}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "${#landed[@]} landed work branches"
          if [ "${#landed[@]}" -eq 0 ] || [ "$DRY_RUN" = true ]; then
            printf '%s\n' "${landed[@]}"
            exit 0
          fi
          # In batches; one already gone (deleted meanwhile) doesn't stop the others.
          failed=0
          for ((i = 0; i < ${#landed[@]}; i += 50)); do
            git push origin --delete "${landed[@]:i:50}" || failed=1
          done
          if [ "$failed" = 1 ]; then echo "::warning::Some branches could not be deleted (already gone?)"; fi
